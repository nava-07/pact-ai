services:
  - type: web
    name: pact-ai-api
    runtime: docker
    dockerfilePath: ./server/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - { key: NODE_ENV, value: production }
      - { key: PAYPAL_BASE_URL, value: https://api-m.sandbox.paypal.com }
      - { key: GEMINI_MODEL, value: gemini-2.5-flash }
      - { key: MONGODB_URI, sync: false }
      - { key: SESSION_SECRET, generateValue: true }
      - { key: GEMINI_API_KEY, sync: false }
      - { key: PAYPAL_CLIENT_ID, sync: false }
      - { key: PAYPAL_CLIENT_SECRET, sync: false }
      - { key: PAYPAL_WEBHOOK_ID, sync: false }
      - { key: CLIENT_URL, sync: false }   # your static site URL
      - { key: SERVER_URL, sync: false }   # this service's URL
  - type: web
    name: pact-ai-client
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - { type: rewrite, source: /*, destination: /index.html }
    envVars:
      - { key: VITE_API_URL, sync: false }  # the API service URL
